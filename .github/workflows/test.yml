name: Test Squint PWA
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile and test Squint
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Verify Pages artifacts
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/icon-192.png
          test -s dist/sw.js
          test ! -e dist/fuel-mileage-history.csv
